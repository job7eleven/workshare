<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>陽明山45號客廳鋼構屋頂替代方案（方案一-3）3D施工說明示意（20261121 C版）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0;overflow:hidden}
  body{font-family:"Microsoft JhengHei","微軟正黑體","Noto Sans TC",sans-serif;background:#eef1f4;color:#1f2933}
  #view{position:fixed;inset:0;touch-action:none}
  #view canvas{display:block;touch-action:none}
  .panel{position:fixed;background:rgba(255,255,255,.96);border:1px solid #cfd6de;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);font-size:13px;z-index:10}
  .panel-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;user-select:none}
  .panel-bar-title{font-weight:bold;font-size:13.5px;color:#1f2933;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-actions{display:flex;align-items:center;gap:4px;flex:none}
  .btn-toggle{font-size:12px;padding:3px 8px;border:1px solid #9aa5b1;background:#f8fafc;color:#334e68;border-radius:5px;cursor:pointer;white-space:nowrap}
  .btn-toggle:hover{background:#e4e7eb}
  .btn-fab{position:fixed;z-index:20;display:none;align-items:center;gap:6px;padding:7px 12px;font-family:inherit;font-size:13px;font-weight:bold;color:#fff;background:#0b69a3;border:1px solid #095788;border-radius:8px;box-shadow:0 3px 10px rgba(11,105,163,.28);cursor:pointer;white-space:nowrap}
  .btn-fab:hover{background:#095788}
  .btn-fab.show{display:inline-flex}

  #hd{top:12px;left:12px;padding:10px 14px;width:330px}
  #hd h1{font-size:15px;margin:0 0 4px;line-height:1.3}
  #hd p{margin:2px 0;color:#52606d;font-size:12px}

  #lay{top:66px;left:12px;padding:10px 14px;width:330px;max-height:calc(100vh - 124px);display:flex;flex-direction:column}
  #lay.collapsed{display:none}
  #lay-bar{padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid #e4e7eb;flex:none}
  #lay-body{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-right:2px}
  #btn-lay-show{top:66px;left:12px}
  #lay label{display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer;line-height:1.35}
  .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.2);flex:none}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  button{font-family:inherit;font-size:12px;padding:5px 9px;border:1px solid #9aa5b1;background:#fff;border-radius:4px;cursor:pointer;color:#1f2933}
  button:hover{background:#e4e7eb}
  button.on{background:#0b69a3;color:#fff;border-color:#0b69a3}
  h3{font-size:13px;margin:12px 0 4px;border-top:1px solid #e4e7eb;padding-top:8px}
  #steps{margin:6px 0 0;padding-left:20px;font-size:12px}
  #steps li{cursor:pointer;margin:4px 0;color:#52606d;line-height:1.4}
  #steps li.cur{color:#c62828;font-weight:bold}

  #info{right:12px;top:12px;width:360px;padding:10px 14px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
  #info-bar{padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid #e4e7eb;cursor:pointer;flex:none}
  #info-body{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-right:2px}
  #info.minimized{width:auto;max-width:280px;padding:7px 11px}
  #info.minimized #info-bar{padding-bottom:0;margin-bottom:0;border-bottom:none}
  #info.minimized #info-body{display:none}
  #info h2{font-size:15px;margin:0 0 6px}
  #info .tag{display:inline-block;font-size:11px;background:#e3f2fd;color:#0b69a3;border-radius:3px;padding:1px 6px;margin-bottom:6px}
  #info .tag.path{background:#ffebee;color:#c62828}
  #info table{border-collapse:collapse;width:100%;font-size:12px;margin-top:6px}
  #info td{border-top:1px solid #e4e7eb;padding:5px 4px;vertical-align:top;line-height:1.4}
  #info td:first-child{white-space:nowrap;font-weight:bold;color:#3e4c59;width:64px}

  #hint{left:50%;transform:translateX(-50%);bottom:12px;padding:6px 10px;font-size:12px;color:#52606d;pointer-events:none;white-space:nowrap}
  input[type=range]{width:140px;vertical-align:middle}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:5}
  .alab{position:absolute;transform:translate(8px,-50%);background:rgba(255,255,255,.93);border-left:3px solid #c62828;border-radius:3px;padding:3px 6px;font-size:11.5px;line-height:1.35;max-width:230px;box-shadow:0 1px 4px rgba(0,0,0,.18);color:#1f2933}
  .alab b{color:#c62828}

  /* 手機與窄螢幕優化 */
  @media (max-width:768px){
    #hd{top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;width:auto;padding:7px 10px}
    #hd h1{font-size:13.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #hd p{font-size:11px;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #hd p.hd-sub2{display:none}

    #btn-lay-show{top:calc(50px + env(safe-area-inset-top));left:8px;padding:8px 13px;font-size:13px}
    #lay{top:calc(50px + env(safe-area-inset-top));left:8px;right:8px;width:auto;max-width:380px;max-height:calc(100dvh - 100px - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:10px 12px;z-index:30}
    #lay label{margin:6px 0;font-size:13px}
    #lay input[type=checkbox]{width:18px;height:18px;flex:none}
    button{font-size:13px;padding:7px 10px;min-height:34px}
    .btn-toggle{font-size:12px;padding:5px 9px;min-height:30px}
    input[type=range]{width:130px;height:24px}

    #info{top:calc(50px + env(safe-area-inset-top));right:8px;left:8px;width:auto;max-height:calc(62dvh);padding:10px 12px;z-index:35}
    #info.minimized{left:auto;right:8px;max-width:calc(100vw - 132px);padding:6px 10px;z-index:20}
    #info.minimized .panel-bar-title{font-size:12.5px}
    #info table{font-size:12.5px}
    #info td:first-child{width:56px}

    #hint{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));transform:none;text-align:center;font-size:11px;padding:5px 8px;white-space:normal;opacity:.9}
    .alab{font-size:10.5px;max-width:170px;padding:2px 5px}
  }
</style>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>
<div id="hd" class="panel">
  <h1 style="margin:0">45號客廳屋頂 鋼構方案一 3D 施工說明示意</h1>
</div>

<button id="btn-lay-show" class="btn-fab" type="button" aria-controls="lay" aria-expanded="false">☰ 顯示操作</button>

<div id="lay" class="panel">
  <div id="lay-bar" class="panel-bar">
    <span class="panel-bar-title">操作</span>
    <div class="bar-actions">
      <button id="btn-lay-hide" class="btn-toggle" type="button">收折 ✕</button>
    </div>
  </div>
  <div id="lay-body">
    <b>圖層</b><span style="font-size:11px;color:#7b8794">（依施工順序：1 RC → 2 鋼構 → 3 金屬屋頂 → 4 木構 → 5 玻璃）</span>
    <div id="layers"></div>
    <div style="margin-top:8px">金屬屋頂量體不透明度 <input id="op" type="range" min="0" max="100" value="35"> <span id="opv">35%</span></div>
    <div class="btns">
      <button data-v="iso">等角</button><button data-v="s">南向</button><button data-v="n">北向（入口）</button>
      <button data-v="e">東向</button><button data-v="top">俯視</button><button data-v="in">屋內視角</button>
    </div>
    <div class="btns">
      <button id="steelOnly">只看鋼構</button><button id="woodOnly">只看木構</button><button id="finish">完成樣貌</button><button id="all">全部顯示</button>
    </div>
    <h3>力學分析（依載重情境逐步）</h3>
    <div class="btns" id="scn"></div>
    <ol id="steps"></ol>
    <div class="btns"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button><button id="play">自動播放</button><button id="exit">結束</button></div>
  </div>
</div>

<div id="info" class="panel">
  <div id="info-bar" class="panel-bar">
    <span id="info-bar-title" class="panel-bar-title">說明</span>
    <div class="bar-actions">
      <button id="btn-info-home" class="btn-toggle" type="button" style="display:none">說明</button>
      <button id="btn-info-min" class="btn-toggle" type="button" aria-expanded="true">— 最小化</button>
    </div>
  </div>
  <div id="info-body"></div>
</div>

<div id="hint" class="panel">左鍵拖曳：旋轉｜右鍵拖曳：平移｜滾輪：縮放｜點選構件：顯示說明</div>
<script>
// ======================= 幾何參數（cm） =======================
const G=135, HALF=365, K=2.27, FL=90, Z_RC=357.6, Z_RB=381.6, RF_TOP=566.1, RIDGE=590, Z_ENT=548.2;
const COS=Math.cos(Math.atan(1/K)), RV=20/COS, D15=15/COS, CLAD=2.2, PC=12.5;
const ax=i=>(i-1)*G;                       // x：東為正，軸1=0
const zA=0, zB=-365, zC=-730, zD=-995;      // z：北為負
const zt=d=>RF_TOP-Math.abs(d)/K;           // 主樑頂
const zf=d=>RIDGE-Math.abs(d)/K;            // 主屋面完成
const fe=dx=>Z_ENT-Math.abs(dx)/K;          // 入口屋面完成
const be=dx=>fe(dx)-RV;                     // 入口量體底＝入口鋼構底
const PURL=[36.6,119.0,201.4,283.8,366.2];
const XSB=416.1, SBN=373.5;                 // 主樑端距屋脊；SB-2～6北端（止於C線環樑外緣）
const yV=-(365+95), X4=ax(4), xEW=ax(2)-60, xEE=ax(6)+60, eC=zC-60, eA=60, yEN=zD-60;
const WB_TOP=be(280);
const ER_D=[119.0,201.4,283.8,366.2,448.6,531.0,613.4];   // 入口斜樑（距B軸）＝主屋頂橫樑延伸線
const xa=-50, xb=ax(10)+110;

// ======================= 場景 =======================
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0xe9e6e0); view.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,10,20000);
scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,0.75));
const dl=new THREE.DirectionalLight(0xffffff,0.65); dl.position.set(800,1500,900); scene.add(dl);
const grid=new THREE.GridHelper(3000,30,0xc0c8d0,0xd8dee4); grid.position.set(600,0,-450); scene.add(grid);

const LAYERS={
  grid:{name:'軸線、尺寸與高程標註',color:0xe53935,op:1},
  rc:{name:'1. RC 牆／結構樓板（清水模色）',color:0xa89c8e,op:0.6},
  rcE:{name:'1. 入口 RC：山牆到頂、WB、軸2 柱樑',color:0x978b7d,op:0.7},
  ring:{name:'2. 鋼環樑 RB-R／RB-W／RB-E／HB-1＋錨栓',color:0x3b6ea8,op:1},
  sb:{name:'2. 主斜樑 SB-1～10（SB-2～6 止於環樑）',color:0x2a9aa8,op:1},
  purlin:{name:'2. 橫樑 C125（主屋頂，垂直屋面）',color:0xd9a521,op:1},
  brace:{name:'2. 端跨水平斜撐 BR R16',color:0xb0306a,op:1},
  ent:{name:'2. 入口鋼構（藏於量體內）ER-R／ER／JR／VR／EP',color:0x5a9a4a,op:1},
  roof:{name:'3. 金屬屋頂量體 20 cm（深灰）',color:0x3f3d3b,op:0.35},
  clad:{name:'4. 花旗松包覆（主斜樑、環樑、簷口封邊）',color:0xd29a5c,op:1},
  ywood:{name:'4. Y型木構造型（純裝飾，不分擔結構）',color:0xc98b4e,op:1},
  glass:{name:'5. 玻璃（東落地窗、東西三角窗、北窗）',color:0x9fc5d6,op:0.35}
};
const groups={}, mats={};
const lb=document.getElementById('layers');
const defaultOff=['clad','ywood'];
for(const k in LAYERS){
  groups[k]=new THREE.Group(); scene.add(groups[k]);
  const L=LAYERS[k], el=document.createElement('label');
  el.innerHTML=`<input type="checkbox" data-k="${k}" ${defaultOff.includes(k)?'':'checked'}><span class="sw" style="background:#${L.color.toString(16).padStart(6,'0')}"></span>${L.name}`;
  lb.appendChild(el);
  groups[k].visible=!defaultOff.includes(k);
}
lb.addEventListener('change',e=>{const k=e.target.dataset.k; if(k) groups[k].visible=e.target.checked;});
function setLayer(k,v){groups[k].visible=v; lb.querySelector(`[data-k="${k}"]`).checked=v;}
function mat(k){ if(!mats[k]){const L=LAYERS[k]; mats[k]=new THREE.MeshStandardMaterial({color:L.color,transparent:L.op<1,opacity:L.op,roughness:0.6,metalness:['rc','rcE','roof','glass','clad','ywood'].includes(k)?0:0.35,side:THREE.DoubleSide,depthWrite:L.op>=0.6});} return mats[k]; }
const dimMat=new THREE.MeshStandardMaterial({color:0xcfd6de,transparent:true,opacity:0.08,depthWrite:false,side:THREE.DoubleSide});
const hiMat={};
function hmat(k){ if(!hiMat[k]){hiMat[k]=mat(k).clone(); hiMat[k].transparent=false; hiMat[k].opacity=1; hiMat[k].depthWrite=true; hiMat[k].emissive=new THREE.Color(0x331100);} return hiMat[k]; }
const pickables=[];
function reg(m,layer,info,keys){ m.userData={info,layer,keys:keys||[]}; groups[layer].add(m); pickables.push(m); return m; }
function box(layer,x0,x1,y0,y1,z0,z1,info,keys){
  const g=new THREE.BoxGeometry(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0));
  const m=new THREE.Mesh(g,mat(layer)); m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); return reg(m,layer,info,keys);
}
// 構件：p1→p2 為頂面中心線，寬 b、深 d（垂直構件軸向下）
function member(layer,p1,p2,b,d,info,keys){
  const a=new THREE.Vector3(...p1), c=new THREE.Vector3(...p2), dir=c.clone().sub(a), len=dir.length(); dir.normalize();
  const g=new THREE.BoxGeometry(len,d,b); g.translate(len/2,-d/2,0);
  const m=new THREE.Mesh(g,mat(layer));
  const up=new THREE.Vector3(0,1,0); let yv=up.clone().sub(dir.clone().multiplyScalar(up.dot(dir))); yv.normalize();
  const zv=new THREE.Vector3().crossVectors(dir,yv);
  m.matrixAutoUpdate=false; m.matrix.makeBasis(dir,yv,zv); m.matrix.setPosition(a); return reg(m,layer,info,keys);
}
const TH=Math.atan(1/K);
// 沿 x 的橫樑：底面中心線 (x0..x1, yb, z)，深 d、寬 b，繞 x 軸傾角 a（腹板垂直屋面）
function tiltZ(layer,x0,x1,yb,z,d,b,a,info,keys){ const g=new THREE.BoxGeometry(x1-x0,d,b); g.translate(0,d/2,0);
  const m=new THREE.Mesh(g,mat(layer)); m.position.set((x0+x1)/2,yb,z); m.rotation.x=a; return reg(m,layer,info,keys); }
// 沿 z 的橫樑：底面中心 (x, yb)，z0..z1，繞 z 軸傾角 a
function tiltX(layer,x,yb,z0,z1,d,b,a,info,keys){ const g=new THREE.BoxGeometry(b,d,Math.abs(z1-z0)); g.translate(0,d/2,0);
  const m=new THREE.Mesh(g,mat(layer)); m.position.set(x,yb,(z0+z1)/2); m.rotation.z=a; return reg(m,layer,info,keys); }
function rod(layer,p1,p2,r,info,keys){
  const a=new THREE.Vector3(...p1), c=new THREE.Vector3(...p2), len=a.distanceTo(c);
  const g=new THREE.CylinderGeometry(r,r,len,8); g.translate(0,len/2,0);
  const m=new THREE.Mesh(g,mat(layer)); m.position.copy(a);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),c.clone().sub(a).normalize()); return reg(m,layer,info,keys);
}
// 屋頂量體：平面多邊形（x,z），頂面高 hf，厚 RV（鉛直）
function slab(layer,pts,hf,info,keys){
  const v2=pts.map(p=>new THREE.Vector2(p[0],p[1]));
  const tris=THREE.ShapeUtils.triangulateShape(v2,[]); const pos=[];
  const T=p=>[p[0],hf(p[0],p[1]),p[1]], B=p=>[p[0],hf(p[0],p[1])-RV,p[1]];
  tris.forEach(t=>{ t.forEach(i=>pos.push(...T(pts[i]))); [...t].reverse().forEach(i=>pos.push(...B(pts[i]))); });
  for(let i=0;i<pts.length;i++){ const p=pts[i], q=pts[(i+1)%pts.length]; pos.push(...T(p),...B(p),...T(q),...T(q),...B(p),...B(q)); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.computeVertexNormals();
  return reg(new THREE.Mesh(g,mat(layer)),layer,info,keys);
}
function wallXY(layer,pts,zc,t,holes,info,keys){
  const s=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));
  (holes||[]).forEach(h=>s.holes.push(new THREE.Path(h.map(q=>new THREE.Vector2(q[0],q[1])))));
  const g=new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false}); g.translate(0,0,zc-t/2);
  return reg(new THREE.Mesh(g,mat(layer)),layer,info,keys);
}

// ======================= 構件說明 =======================
const I={
  rcWall:{tag:'RC 牆',title:'南北 RC 牆 T20（面外懸臂）',rows:[['垂直筋','雙層 #4@20（牆底固定於45FL）／#4@15（固定於GL+0）'],['水平筋','#4@25；開口兩側100cm內 #4@15'],['牆頂','GL+357.6；錨栓每支承2-M16＋中間每45cm一組，U型補強筋#3@15'],['設計考量','無張弦，屋架推力全由牆面外懸臂抵抗；Mu 2.74～3.93 tf-m/m']]},
  slab:{tag:'RC',title:'結構樓板 t=15（閉合框架）',rows:[['配筋','上下層 #4@15'],['設計考量','與A、C牆一體澆置，平衡牆底彎矩；既有PC樓板不得作結構用']]},
  wing:{tag:'入口翼牆',title:'軸3／軸6 入口翼牆（面內扶壁）',rows:[['功能','承 HB-1 傳來之 SB-4、5 推力（面內），剪力約2.3 t ≪ φVn'],['軸6',`牆頂 WB 20x40（頂GL+${WB_TOP.toFixed(1)}），承入口斜樑ER`]]},
  gable:{tag:'入口 RC',title:'D線北側 RC 山牆（到頂）',rows:[['厚度','T20，頂＝屋頂量體底'],['承載','ER-R 北端（預埋鋼板）、EP 橫樑'],['開口','北窗 180x115，台度75'],['待確認','高約4.3 m，面外風壓請技師檢核']]},
  c1:{tag:'入口 RC',title:'C1 軸2 RC柱 30x30（暫定）',rows:[['配筋','4-#5，#3@10／@15'],['備案','若RC不可行改鋼柱□150x150x6＋鋼樑'],['詳圖','D9']]},
  rb21:{tag:'入口 RC',title:'RB2-1 RC樑 20x40（軸2，C～D）',rows:[['頂高',`GL+${WB_TOP.toFixed(1)}`],['承載','ER 西端（楔形座板＋2-M16錨栓）'],['檢核','Mu≈0.6 tf-m ≪ φMn 3.2']]},

const ptrs=new Map();
let drag=null, moved=false, pinchDist=0, pinchMid=null;
function panBy(dx,dy){
  const f=sph.r/(isMobile()?650:900);
  const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
  const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
  target.addScaledVector(right,-dx*f).addScaledVector(up,dy*f);
}
function getPinch(){
  const arr=[...ptrs.values()];
  const dx=arr[0].x-arr[1].x, dy=arr[0].y-arr[1].y;
  return { dist:Math.hypot(dx,dy), mid:{x:(arr[0].x+arr[1].x)/2, y:(arr[0].y+arr[1].y)/2} };
}
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
renderer.domElement.addEventListener('pointerdown',e=>{
  try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    drag={b:e.pointerType==='touch'?0:e.button,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};
    moved=false;
  } else if(ptrs.size===2){
    moved=true; drag=null;
    const p=getPinch(); pinchDist=p.dist; pinchMid=p.mid;
  }
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2 && pinchMid){
    const p=getPinch();
    if(pinchDist>0 && p.dist>0){
      sph.r=Math.min(Math.max(sph.r*(pinchDist/p.dist),120),8000);
    }
    panBy(p.mid.x-pinchMid.x, p.mid.y-pinchMid.y);
    pinchDist=p.dist; pinchMid=p.mid;
    upd();
    return;
  }
  if(!drag || ptrs.size!==1) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6) moved=true;
  drag.x=e.clientX; drag.y=e.clientY;
  if(drag.b===0){ sph.th-=dx*0.006; sph.ph=Math.min(Math.max(sph.ph-dy*0.006,0.02),Math.PI/2+0.4); }
  else { panBy(dx,dy); }
  upd();
});
function endPtr(e){
  const wasSingle=ptrs.size===1 && drag && !moved && (e.pointerType==='touch' || drag.b===0);
  ptrs.delete(e.pointerId);
  if(wasSingle && e.target===renderer.domElement) pick(e);
  if(ptrs.size===1){
    const [rem]=ptrs.values();
    drag={b:0,x:rem.x,y:rem.y,sx:rem.x,sy:rem.y};
    moved=true;
  } else {
    drag=null;
  }
  if(ptrs.size<2){ pinchDist=0; pinchMid=null; }
}
renderer.domElement.addEventListener('pointerup',endPtr);
renderer.domElement.addEventListener('pointercancel',endPtr);
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault(); sph.r=Math.min(Math.max(sph.r*(e.deltaY>0?1.1:0.9),120),8000); upd();},{passive:false});

 '橫樑 → 主斜樑 SB（人字屋架）':[[0,'<b>橫樑反力 262 kgf／點</b>'],[3,'<b>SB H200x100</b>：DCR 0.26<br>無張弦，屋脊愈剛推力愈大']],
 '入口屋頂 → ER／ER-R → WB 與 SB-4':[[0,'<b>ER-R 反力 1.70 t</b>→SB-4包覆上緣<br>藏於量體，深度限15→H150x150'],[1,'<b>ER 牆端 0.38 t／支</b>→WB<br>簡支無推力，DCR 0.08']],
 '屋架推力 → 環樑 → 錨栓 → RC 牆':[[0,'<b>推力 1.33 t／榀</b>（0.99 tf/m）<br>環樑收集→2-M16錨栓→T20牆'],[6,'<b>RC牆面外懸臂</b><br>Mu 2.74～3.93 tf-m/m，#4@20～@15']],
 'C線開口（軸3～6）：HB-1 → 入口翼牆':[[0,'<b>軸4 推力 2.76 t</b>（含ER-R 1.43 t）<br>HB-1 □200 跨開口405，DCR 0.58'],[2,'<b>翼牆面內剪力 2.3 t</b><br>扶壁作用，≪φVn；牆端2-#5']],
 '牆底 → 結構樓板閉合框架 → 基礎':[[0,'<b>牆底彎矩 2.7～3.9 tf-m/m</b>'],[4,'<b>結構樓板 t15 拉住兩側牆</b><br>閉合框架；PC樓板不可用']],
 '屋面風吸 → 扣件 → 橫樑（含懸挑）':[[0,'<b>風吸 −180 kgf/m²</b>（角隅 −280）<br>取消配重，改靠接合受拉'],[3,'<b>東懸挑110</b><br>橫樑C125 DCR 0.40'],[4,'<b>入口北懸挑76.6</b><br>EP C150 DCR 0.19']],
 '橫樑 → SB（L65 角鋼＋2-M12 受拉）':[[0,'<b>上拔 −241 kgf／點</b>（角隅 −434）<br>L65角鋼＋2-M12須受拉']],
 'SB 支承 → 4-M16 F10T → 環樑':[[0,'<b>支承上拔 1.11 t</b>（角隅2.0～2.2 t）<br>座板＋4-M16 F10T']],
 '環樑 → 錨栓 → 牆筋 → 牆自重平衡':[[0,'<b>淨上拔 0.82 t/m</b><br>錨栓埋深≥25，與牆筋搭接'],[3,'<b>牆自重 1.16 t/m</b>（×0.9）<br>大於上拔，免配重']],
 '入口：ER → 楔形座板 → 錨栓 → WB／RB2-1；ER-R → SB-4':[[0,'<b>ER 上拔約0.3 t／支</b><br>楔形座板＋2-M16錨栓（邊距10待檢）'],[2,'<b>ER-R 南端</b><br>4-M16 F10T 受拉']],
 '東面山牆風壓 → 落地窗上緣／三角窗 → RB-E':[[1,'<b>山牆風壓</b>→RB-E<br>□200 弱向 Mu 2.8 tf-m，DCR 0.26<br>落地窗上軌撓度待門窗廠']],
 '屋面橫樑 → 端跨水平斜撐 BR':[[0,'<b>山牆風約 2.0 t／端</b><br>BR R16 每支0.5 t，DCR 0.12<br>取代脊樑的縱向穩定']],
 'BR → SB → 環樑 → A／C 牆面內':[[0,'<b>傳入A、C長向牆面內</b><br>面內勁度大，容量充裕']]
};
const labBox=document.getElementById('labels'); let labs=[];
function clearLabs(){ labBox.innerHTML=''; labs=[]; }
function drawLabs(st){ clearLabs(); (LABS[st.t]||[]).forEach(([i,h])=>{ const a=st.ar[i]; if(!a) return;
  const el=document.createElement('div'); el.className='alab'; el.innerHTML=h; labBox.appendChild(el);
  labs.push({el,p:new THREE.Vector3(...a.o)}); }); }
function updLabs(){ labs.forEach(L=>{ const v=L.p.clone().project(camera);
  if(v.z>1){L.el.style.display='none';return;} L.el.style.display='block';
  L.el.style.left=((v.x+1)/2*innerWidth)+'px'; L.el.style.top=((1-v.y)/2*innerHeight)+'px'; }); }
let cur=null, si=0, timer=null;
const scnBox=document.getElementById('scn'), stepsEl=document.getElementById('steps');
for(const k in SC){ const b=document.createElement('button'); b.textContent=SC[k].name; b.dataset.s=k; b.onclick=()=>startPath(k); scnBox.appendChild(b); }
function startPath(k){ cur=k; si=0; scnBox.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===k));
  stepsEl.innerHTML=SC[k].steps.map((s,i)=>`<li data-i="${i}">${s.t}</li>`).join('');
  stepsEl.querySelectorAll('li').forEach(li=>li.onclick=()=>{si=+li.dataset.i; showStep();});
  for(const g in groups) groups[g].visible=true; showStep(); }
function showStep(){
  const st=SC[cur].steps[si];
  stepsEl.querySelectorAll('li').forEach((li,i)=>li.classList.toggle('cur',i===si));
  pickables.forEach(m=>{ const on=m.userData.keys.some(x=>st.keys.includes(x)); m.material= on? hmat(m.userData.layer) : dimMat; });
  while(arrows.children.length) arrows.remove(arrows.children[0]);
  st.ar.forEach(a=>{ const d=new THREE.Vector3(...a.d).normalize(); arrows.add(new THREE.ArrowHelper(d,new THREE.Vector3(...a.o),a.l,a.c,a.l*0.3,a.l*0.18)); });
  view_(st.view); drawLabs(st);
  infoBarTitle.textContent=`力學分析 ${si+1}/${SC[cur].steps.length}`;
  btnInfoHome.style.display='';
  infoBody.innerHTML=`<span class="tag path">力學分析｜${SC[cur].name}｜步驟 ${si+1}/${SC[cur].steps.length}</span><h2>${st.t}</h2><table>${st.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
  <p style="font-size:11px;color:#7b8794">箭頭：紅＝重力／推力；青＝風拔；橘＝轉換（樑→牆）；紫＝牆底與自重。數值依計算書彙整初稿 R2，待技師覆核。</p>`;
  setInfoMin(false);
}
function endPath(){ if(timer){clearInterval(timer);timer=null;} cur=null; clearLabs(); pickables.forEach(m=>m.material=mat(m.userData.layer));
  while(arrows.children.length) arrows.remove(arrows.children[0]); stepsEl.innerHTML=''; scnBox.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  for(const k in groups) groups[k].visible=lb.querySelector(`[data-k="${k}"]`).checked; home(); }
document.getElementById('next').onclick=()=>{ if(!cur) startPath('G'); else { si=Math.min(si+1,SC[cur].steps.length-1); showStep(); } };
document.getElementById('prev').onclick=()=>{ if(cur){ si=Math.max(si-1,0); showStep(); } };
document.getElementById('exit').onclick=endPath;
document.getElementById('play').onclick=()=>{ if(timer){clearInterval(timer);timer=null;return;} if(!cur) startPath('G');
  timer=setInterval(()=>{ if(si<SC[cur].steps.length-1){si++; showStep();} else {clearInterval(timer); timer=null;} },3500); };

// ======================= 點選說明 =======================
function show(d){
  infoBarTitle.textContent=d.title;
  btnInfoHome.style.display='';
  infoBody.innerHTML=`<span class="tag">${d.tag}</span><h2>${d.title}</h2><table>${d.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
  setInfoMin(false);
}
function home(){
  infoBarTitle.textContent='說明';
  btnInfoHome.style.display='none';
  infoBody.innerHTML=`<h2>說明</h2><table>
<tr><td>依據</td><td>施工說明圖 -4（S-01～S-04）、結構計算說明 R3（2026/11/20）；色調參考設計師彩圖</td></tr>
<tr><td>單位</td><td>cm，模型 1:1；構件以結構技師簽證圖說為準</td></tr>
<tr><td>系統</td><td>方案一：無張弦、無脊樑；推力由鋼環樑→T20 RC 牆（面外）與入口翼牆（面內）承受</td></tr>
<tr><td>主屋頂</td><td>SB H200x100 @135；橫樑 C125 沿坡@90（腹板垂直屋面）；端跨水平斜撐 BR；SB-2～6 北端止於環樑</td></tr>
<tr><td>入口</td><td>軸2～6、屋脊軸4；斜樑、脊樑、橫樑頂底齊平（深15），藏於20cm金屬屋頂量體；谷樑底切齊主斜樑上緣</td></tr>
<tr><td>木構</td><td>主斜樑、環樑、簷口花旗松包覆（完成後不見鋼構）；Y型木構純裝飾</td></tr>
<tr><td>開口</td><td>東落地窗 570x約270（頂接RB-E包覆底）、東西三角窗、北窗 180x115</td></tr>
<tr><td>檢核</td><td>全部 DCR&lt;1；最大 SB-4 約0.49、HB-1 0.55；D 實際約81 &lt; 100</td></tr>
<tr><td>鋼料</td><td>約5.3 t（逐項計重）</td></tr>
<tr><td>操作</td><td>左側「操作」可切換圖層、視角、「力學分析」逐步檢視；點選構件看斷面與設計考量</td></tr>
</table><p style="font-size:12px;color:#52606d">點選任一構件可看斷面、檢核與設計考量。</p>`;
}
home();
const ray=new THREE.Raycaster(), mv=new THREE.Vector2();
function vis(o){ while(o){ if(o.visible===false) return false; o=o.parent; } return true; }
function pick(e){
  mv.x=e.clientX/innerWidth*2-1; mv.y=-e.clientY/innerHeight*2+1; ray.setFromCamera(mv,camera);
  const cand=pickables.filter(m=>vis(m)&&m.material!==dimMat&&!(m.userData.layer==='roof'&&mat('roof').opacity<0.5));
  const hit=ray.intersectObjects(cand,false)[0];
  if(hit) show(hit.object.userData.info); else if(cur) showStep(); else home();
}
(function loop(){ renderer.render(scene,camera); updLabs(); requestAnimationFrame(loop); })();
</script>
